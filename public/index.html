<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jev Stories</title>
  <meta name="description" content="Everyone writes the next line of a shared story. Jev picks the winner.">
  <!-- Link previews. The Worker fills in absolute URLs and a card per room (src/preview.js). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Jev Stories">
  <meta property="og:title" content="Jev Stories">
  <meta property="og:description" content="Everyone writes the next line of a shared story. Jev picks the winner.">
  <meta property="og:url" content="/">
  <meta property="og:image" content="/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Jev Stories logo, a gold-cornered book">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0E1512">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jev Stories">
  <link rel="preload" href="/fonts/bagel-fat-one-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/lexend-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header id="topbar" hidden>
    <button class="tb-code" data-action="copy-link" title="Copy the invite link">
      <b id="tb-room">Room</b> <span class="tb-label" id="tb-count"></span>
    </button>
    <span id="tb-story" class="tb-story"></span>
    <div class="tb-actions">
      <button class="tb-btn" data-action="toggle-scores" title="Scores">Scores</button>
      <button class="tb-btn danger" data-action="ask-leave" title="Leave the room">Leave</button>
    </div>
  </header>
  <div id="conn" hidden>Reconnecting…</div>

  <main id="screen"></main>

  <aside id="drawer" hidden>
    <button class="drawer-backdrop" data-action="toggle-scores" aria-label="Close"></button>
    <div class="drawer-panel">
      <div class="drawer-head">
        <h2>Jev's judgement criteria</h2>
        <button class="tb-btn" data-action="toggle-scores">Close</button>
      </div>
      <div id="drawer-jev" class="drawer-jev"></div>
      <h2 class="drawer-title">Scores</h2>
      <ol id="drawer-list" class="scores"></ol>
    </div>
  </aside>

  <dialog id="leave-dialog">
    <form method="dialog" class="dialog-body">
      <h2>Leave the room?</h2>
      <p>Your score is wiped when you leave. You can come back any time.</p>
      <div class="row end">
        <button class="btn" type="button" data-action="cancel-leave">Stay</button>
        <button class="btn danger" type="button" data-action="confirm-leave">Leave</button>
      </div>
    </form>
  </dialog>

  <dialog id="end-dialog">
    <form method="dialog" class="dialog-body">
      <h2>End the story?</h2>
      <p>The story ends now for everyone, and Jev scores it.</p>
      <div class="row end">
        <button class="btn" type="button" data-action="cancel-end">Keep going</button>
        <button class="btn danger" type="button" data-action="confirm-end">End the story</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
