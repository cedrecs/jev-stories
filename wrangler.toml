name = "jev-stories"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Two Workers Custom Domains (Cloudflare makes the DNS records and the
# certificates): the website, and the Discord version's address, which the
# Discord app's URL mapping points at. The workers.dev address stays on so old
# links keep forwarding; setting routes would otherwise switch it off.
routes = [
  { pattern = "jev-yarn.jevie.app", custom_domain = true },
  { pattern = "yarn.jevie.app", custom_domain = true },
]
workers_dev = true

# Static PWA shell. Unknown paths (e.g. /r/ABCD invite links) fall back to index.html.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Every request goes through the Worker so the static files get the security
# headers too (src/headers.js); the Worker hands them on to the asset binding.
run_worker_first = true

# One Durable Object per room: holds players, the story, timers and the WebSockets.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true

# Secrets are NOT set here.
#   local:  put TYPESAFE_API_KEY=... in .dev.vars (gitignored)
#   prod:   npx wrangler secret bulk .dev.vars
#
[vars]
# The Discord app whose Activity runs the game inside Discord: its Application
# ID, which is public. Room connections are accepted from its address,
# <id>.discordsays.com. Empty means the game is not set up for Discord.
DISCORD_CLIENT_ID = "1551812885666332682"
# The website's address. Page visits to the old workers.dev address are
# forwarded here (src/headers.js). Staging leaves it unset and forwards nothing.
CANONICAL_HOST = "jev-yarn.jevie.app"
# The Discord version's address. It serves the Discord terms and privacy pages
# at /terms and /privacy; any other visit from an ordinary browser goes to the
# website. Staging leaves it unset.
DISCORD_HOST = "yarn.jevie.app"
# Room settings are fixed per deployment. Uncomment a line to change a default
# (values are clamped to the ranges in src/rules.js):
# WRITING_SECONDS = "60"      # 30 to 120, per line
# THEME_SECONDS = "90"        # 30 to 180, for the theme setter
# REVEAL_SECONDS = "30"       # 10 to 120, the tap-and-read pause after each pick
# STORY_END_SECONDS = "30"    # 10 to 120, the finished-story screen
# MAX_SENTENCE_CHARS = "280"  # 80 to 500
# MAX_PLAYERS = "100"         # 2 to 100, per room
# MOCK_JUDGE = "1"            # development only: fake judge when no key is set

# The staging copy, safe to break: npx wrangler deploy --env staging. It keeps
# its own workers.dev address and never claims the custom domain. Bindings and
# vars do not carry over from the top level, so they are repeated here.
[env.staging]
name = "jev-stories-staging"
routes = []
workers_dev = true

[env.staging.vars]
DISCORD_CLIENT_ID = "1551812885666332682"

[[env.staging.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"
